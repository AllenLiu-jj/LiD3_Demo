[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lid3-actor1-4-demo"
version = "0.1.0"
description = "N200 wide-view 4D-GS video with SAM3 outlines and 2D relations"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "av>=14,<20", "opencv-python-headless>=4.10,<6", "scipy>=1.12,<2", "plyfile>=1,<2", "tqdm>=4.66,<5", "timm>=0.9.7,<2", "einops>=0.8,<1", "ftfy>=6,<7", "regex", "iopath>=0.1.10", "hydra-core>=1.3,<2", "submitit>=1.5,<2", "decord>=0.6", "huggingface-hub>=0.30,<2", "pycocotools>=2.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
actor-video = "actor_demo.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
